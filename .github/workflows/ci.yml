name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: eliware/galera-lib
          ref: main
          path: galera-lib
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
        working-directory: galera-lib
      - run: npm pack --pack-destination .
        working-directory: galera-lib
      - run: npm pkg set dependencies.@eliware/galera-lib=file:./galera-lib/eliware-galera-lib-0.1.0.tgz
      - run: npm install --package-lock=false
      - run: npm test
      - run: npm run lint
      - run: npm run check
      - run: npm run contracts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm pack --dry-run
