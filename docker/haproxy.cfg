global
  log stdout format raw local0
  maxconn 2048

defaults
  mode http
  log global
  option httplog
  option http-keep-alive
  timeout connect 5s
  timeout client 60s
  timeout client-fin 10s
  timeout server 60s
  timeout tunnel 1h

frontend supervisor_http
  bind :8080
  default_backend supervisor_nodes

backend supervisor_nodes
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  server galera-1 galera-1:8080 check inter 1s fall 2 rise 2 init-addr last,libc,none
  server galera-2 galera-2:8080 check inter 1s fall 2 rise 2 init-addr last,libc,none
  server galera-3 galera-3:8080 check inter 1s fall 2 rise 2 init-addr last,libc,none
