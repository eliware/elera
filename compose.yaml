name: eliware-elera

services:
  elera-single:
    profiles: [single, lab]
    env_file:
      - path: .env
        required: false
    build:
      context: ..
      dockerfile: elera/Dockerfile.dev
    image: eliware/elera:local
    hostname: elera-single
    environment: &single-env
      ROOT_TOKEN: ${ROOT_TOKEN:-root_token_here}
      ELERA_ADVERTISED_HOST: elera-single
      MARIADB_ROOT_PASSWORD: dev-root-password
      MARIADB_DATABASE: app
      MARIADB_USER: healthcheck
      MARIADB_PASSWORD: dev-healthcheck-password
      ELERA_CLUSTER_NAME: local-elera
      ELERA: "0"
      ELERA_CLUSTER_ADDRESS: gcomm://
      ELERA_NODE_NAME: elera-single
      ELERA_NODE_ADDRESS: elera-single
      ELERA_HTTP_PORT: "8080"
    ports: ["3306:3306", "8080:8080", "33060:33060", "33070:33070"]
    volumes: [elera-single-data:/var/lib/mysql]
    healthcheck: &probe
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  elera-1:
    profiles: [cluster, lab]
    env_file:
      - path: .env
        required: false
    build:
      context: ..
      dockerfile: elera/Dockerfile.dev
    image: eliware/elera:local
    hostname: elera-1
    environment:
      <<: *single-env
      ELERA_CLUSTER_ADDRESS: gcomm://elera-1,elera-2,elera-3
      ELERA: "1"
      ELERA_NODE_NAME: elera-1
      ELERA_NODE_ADDRESS: elera-1
      ELERA_BOOTSTRAP: "true"
    ports: ["3307:3306", "8081:8080", "33061:33060", "33071:33070"]
    volumes: [elera-1-data:/var/lib/mysql]
    healthcheck: *probe

  elera-2:
    profiles: [cluster, lab]
    env_file:
      - path: .env
        required: false
    image: eliware/elera:local
    hostname: elera-2
    environment:
      <<: *single-env
      ELERA_CLUSTER_ADDRESS: gcomm://elera-1,elera-2,elera-3
      ELERA: "1"
      ELERA_NODE_NAME: elera-2
      ELERA_NODE_ADDRESS: elera-2
      ELERA_BOOTSTRAP: "false"
    ports: ["3308:3306", "8082:8080", "33062:33060", "33072:33070"]
    volumes: [elera-2-data:/var/lib/mysql]
    depends_on: [elera-1]
    healthcheck: *probe

  elera-3:
    profiles: [cluster, lab]
    env_file:
      - path: .env
        required: false
    image: eliware/elera:local
    hostname: elera-3
    environment:
      <<: *single-env
      ELERA_CLUSTER_ADDRESS: gcomm://elera-1,elera-2,elera-3
      ELERA: "1"
      ELERA_NODE_NAME: elera-3
      ELERA_NODE_ADDRESS: elera-3
      ELERA_BOOTSTRAP: "false"
    ports: ["3309:3306", "8083:8080", "33063:33060", "33073:33070"]
    volumes: [elera-3-data:/var/lib/mysql]
    depends_on: [elera-1]
    healthcheck: *probe

  haproxy:
    profiles: [cluster, lab]
    image: haproxy:3.0-alpine
    depends_on:
      elera-1:
        condition: service_started
      elera-2:
        condition: service_started
      elera-3:
        condition: service_started
    ports: ["8088:8080"]
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  backup-dev:
    profiles: [backup-test, lab]
    build:
      context: ..
      dockerfile: elera/docker/backup-dev.Dockerfile
    image: eliware/elera-backup-dev:local
    depends_on:
      elera-1:
        condition: service_started
      elera-2:
        condition: service_started
      elera-3:
        condition: service_started
      backup-nas:
        condition: service_started
    environment:
      ELERA_API_ENDPOINT: http://haproxy:8080
      ELERA_API_TOKEN: root_token_here
      ELERA_DATABASE: app
      ELERA_IDENTITY: backup-dev
      ELERA_CLUSTER_SQL_HOSTS: elera-1,elera-2,elera-3
      ELERA_RESTORE_VERIFY_HOST: elera-single
      ELERA_RESTORE_VERIFY_PORT: "3306"
    volumes:
      - backup-dev-state:/lab
    command: ["sleep", "infinity"]

  backup-nas:
    profiles: [backup-test, lab]
    build:
      context: ..
      dockerfile: elera/docker/backup-nas.Dockerfile
    image: eliware/elera-backup-nas:local
    ports: ["2222:22"]
    volumes:
      - backup-nas-data:/srv/backups
      - backup-dev-state:/lab:ro

volumes:
  elera-single-data:
  elera-1-data:
  elera-2-data:
  elera-3-data:
  backup-dev-state:
  backup-nas-data:
